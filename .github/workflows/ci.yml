name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @temposoul/core build
      - run: npx tsc --noEmit
      - run: npx tsc --project mcp/tsconfig.json --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @temposoul/core build
      - run: pnpm test
      - run: pnpm run test:e2e
      - run: pnpm run prompt:audit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 源数据质量：构建前先断言 chinaBirthPlaceTree.json 可解析且 longitude 全量覆盖。
      # 用独立脚本而非 `-- --source-only`，避免依赖两层 pnpm 的参数转发语义。
      - name: Check china location source data
        run: pnpm run check:location-data:source
      - run: pnpm --filter @temposoul/core build
      # 陈旧产物守卫：构建后校验 china-data.js 是否仍与 data/chinaBirthPlaceTree.json 一致，
      # 防止生成器脱离构建链。
      - name: Check generated china location data
        run: pnpm run check:location-data
      - run: pnpm run build
      # 产物完整性硬门禁（B 轨，2026-09-26 线上白屏事故复盘）
      # 事故根因：dist/assets/ 为空（0 文件），而 dist/index.html 仍引用 6 个 asset，
      # 坏产物一路通过构建与发布。此处显式独立执行同一断言，让「产物被剥离」这类
      # 失败在 CI UI 上有具名步骤可见，而不是淹没在 "Run pnpm run build" 的日志尾部。
      # 关于「是否从 build 链里摘出来」：不摘。build 链尾那道是第一道（覆盖本地开发
      # 与 Dockerfile），CI 这道是第二道；断言脚本只读、幂等、无副作用，重复执行
      # 开销可忽略。摘掉第一道等于把门禁从「生产者」降级为「靠每个调用方自觉」，
      # 反而更脆。
      # 不设 continue-on-error —— 硬门禁，失败即阻断。
      - name: Verify dist integrity
        run: node scripts/verify-dist-integrity.mjs dist
      # SEO / 元数据门禁（Gate B，软）—— 与 Gate A 物理拆分，避免和「白屏事故」
      # 共用同一个报警铃：Gate A 报红 = 立刻回滚，Gate B 报红 = 排一张内容工单。
      # 这些断言（canonical / hreflang / OG·Twitter / title·description 唯一性 /
      # smoke-expectations 对齐 / JSON-LD / robots / sitemap）会随内容、路由、语种
      # 正常漂移，属内容工单而非线上事故，故 continue-on-error：可见但不阻断。
      # 与 verify-merkle 同策略；口径收口稳定后再议升级为硬门禁。
      - name: Verify dist SEO metadata
        continue-on-error: true
        run: node scripts/verify-dist-seo.mjs dist

  # Merkle 门禁（线程 B 接入，2026-09-18）
  # 独立校验步：冻结 build/artifacts.json 后跑 verify-merkle，断言全站 sitemap 口径（738）
  # 与四域计数（A280/B50/C384/D24）一致。continue-on-error=true：作为可见校验步，
  # 不阻断现有 lint/type-check/test/build 上线流程；收口确认后可去掉 continue-on-error 升为硬门禁。
  verify-merkle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build @temposoul/core (freeze script dependency)
        run: pnpm --filter @temposoul/core build
      - name: Freeze artifacts (build/artifacts.json)
        run: pnpm run freeze:artifacts
      - name: verify-merkle (Merkle + four-domain count gate)
        continue-on-error: true
        run: pnpm run verify:merkle
